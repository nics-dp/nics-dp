[settings]
# Go comes from go.mod's `toolchain goX.Y.Z` line (see [tools]). CI's mise-action
# reads this file, so the setting lives here, not only in a developer's config.
idiomatic_version_file_enable_tools = ["go"]

[tools]
# Go toolchain: go.mod's `toolchain goX.Y.Z` line, read by mise through
# idiomatic_version_file_enable_tools above. go.mod's `go` directive is the
# module's minimum language version and must stay below the toolchain (e.g.
# `go X.Y.0` with `toolchain goX.Y.1`): the go command drops a toolchain line equal
# to the go line. It may lag the toolchain after upgrades; Renovate does not bump it.
# Nothing in this repo gates the Go pins, so keep every Go version pin on one version.
hugo = "0.167.0"
